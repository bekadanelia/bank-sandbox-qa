# Test classes run side by side, the methods inside a class run one after another.
# This is safe because every test creates its own customers and accounts.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
# The thread pool that replaces this one is still marked experimental in JUnit 6.1.
junit.jupiter.execution.parallel.config.executor-service=fork_join_pool

# Test methods are named as sentences with underscores. Reports show them as sentences.
junit.jupiter.displayname.generator.default=io.github.bekadanelia.sandboxbank.junit.ReadableNames

# Lets Allure register its JUnit extension, which adds test parameters to the report.
junit.jupiter.extensions.autodetection.enabled=true
