# Defaults for a local run against docker compose.
# Any key can be overridden with a JVM property (-Dbase.url=...) or an environment variable (BASE_URL=...).

base.url=http://localhost:8080

db.url=jdbc:postgresql://localhost:5432/sandbox_bank
# Read only role. Every verification query runs through it.
db.reader.user=qa_readonly
db.reader.password=qa_readonly
# Schema owner. Used only by tests that prove the constraints refuse bad writes.
db.owner.user=sandbox
db.owner.password=sandbox

# The sandbox signing secret, needed to craft expired tokens.
jwt.secret=local-sandbox-secret

# chromium, firefox or webkit
browser=chromium
headless=true
slow.motion.ms=0
# Path to a browser binary. Leave empty to use the one Playwright downloads.
browser.executable=

# Check every API response against openapi.yaml.
contract.checks=true

# Where requirement ids in the report link to.
requirements.url=https://github.com/bekadanelia/bank-sandbox-qa/blob/main/docs/requirements.md
# The same file on disk, read by the traceability check. Relative to the tests directory.
requirements.file=../docs/requirements.md

# Files outside the test project that the framework self tests compare with each other.
seeded.defects.manifest=../scripts/seeded-defects.csv
seeded.defects.source=../sut/src/faults.js
