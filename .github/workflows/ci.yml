name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every night at 03:17 UTC, so a broken dependency or runner image is noticed within a day.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN: mvn --batch-mode --no-transfer-progress --file tests/pom.xml
  # Keep in step with allure-report.version in tests/pom.xml.
  ALLURE_REPORT_VERSION: 3.20.0

jobs:
  bank-unit-tests:
    name: Bank unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sut
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sut/package-lock.json

      - run: npm ci

      - run: npm test

  tests:
    name: Test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Start Sandbox Bank
        run: docker compose up -d --build --wait

      - name: Install Chromium for Playwright
        run: $MAVEN compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      # The stages go from fast and decisive to slow. A red smoke stage stops the job.
      # After that every stage runs, so one report shows everything that is broken.
      - name: Stage 1. Framework self tests and smoke tests
        id: smoke
        run: $MAVEN test -Dgroups="framework | smoke"

      - name: Stage 2. API tests
        run: $MAVEN test -Dgroups="api & !smoke"

      - name: Stage 3. UI tests and journeys
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: $MAVEN test -Dgroups="(ui | e2e) & !smoke"

      # Last on purpose: the reconciliation checks then judge every row the earlier stages wrote.
      - name: Stage 4. Database tests and reconciliation
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: $MAVEN test -Dgroups="db & !smoke"

      - name: Save the bank log
        if: ${{ failure() }}
        run: docker compose logs --no-color bank > tests/target/bank.log

      - name: Restore the report history
        if: ${{ !cancelled() && hashFiles('tests/target/allure-results/*') != '' }}
        uses: actions/cache@v6
        with:
          path: tests/target/allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            allure-history-${{ github.ref_name }}-
            allure-history-main-

      - name: Build the Allure report
        if: ${{ !cancelled() && hashFiles('tests/target/allure-results/*') != '' }}
        working-directory: tests
        run: npx --yes allure@${{ env.ALLURE_REPORT_VERSION }} generate target/allure-results

      - name: Write the job summary
        if: ${{ !cancelled() && hashFiles('tests/target/allure-report/summary.json') != '' }}
        run: |
          jq -r '
            "### Test results\n",
            "| Total | Passed | Failed | Broken | Skipped |",
            "|------:|-------:|-------:|-------:|--------:|",
            "| \(.stats.total) | \(.stats.passed // 0) | \(.stats.failed // 0) | \(.stats.broken // 0) | \(.stats.skipped // 0) |",
            "\nThe full report is in the artifact named test-report."
          ' tests/target/allure-report/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report and the evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            tests/target/allure-report
            tests/target/traceability.md
            tests/target/playwright-traces
            tests/target/bank.log
          if-no-files-found: warn
          retention-days: 14

      - name: Hand the report to GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.PUBLISH_REPORT == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: tests/target/allure-report

  publish-report:
    name: Publish the report
    needs: tests
    # Off until the repository variable PUBLISH_REPORT is set to true, see the README.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.PUBLISH_REPORT == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  seeded-defects:
    name: Catches ${{ matrix.defect }}
    # Only worth asking once the healthy bank passes. Skipped on pull requests to keep them fast.
    needs: tests
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        defect:
          - FX_TRUNCATE
          - LIMIT_OFF_BY_ONE
          - IDEMPOTENCY_IGNORED
          - NO_ROW_LOCK
          - DEADLOCK_PRONE_LOCK
          - FX_POSITION_SKIPPED
          - IDOR_ACCOUNT_READ
          - STATEMENT_ORDER
          - UI_STALE_BALANCE
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install Chromium for Playwright
        if: ${{ matrix.defect == 'UI_STALE_BALANCE' }}
        run: $MAVEN compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Switch the defect on and expect the suite to catch it
        run: scripts/seeded-defects.sh check ${{ matrix.defect }}
